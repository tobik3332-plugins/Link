name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Calculate Dynamic Version
      run: |
        BUILD_NUM=${{ github.run_number }}
        if [ $BUILD_NUM -lt 100 ]; then
          MINOR=$(( BUILD_NUM / 10 ))
          PATCH=$(( BUILD_NUM % 10 ))
          VERSION="0.$MINOR.$PATCH"
        else
          MAJOR=$(( BUILD_NUM / 100 ))
          REMAINDER=$(( BUILD_NUM % 100 ))
          MINOR=$(( REMAINDER / 10 ))
          PATCH=$(( REMAINDER % 10 ))
          VERSION="$MAJOR.$MINOR.$PATCH"
        fi
        echo "Calculated version: $VERSION for build $BUILD_NUM"
        echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV
        
        # Nastavení verze v pom.xml
        mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

    - name: Build with Maven
      run: mvn clean package

    - name: Rename JAR with version
      run: |
        VERSION=${{ env.PLUGIN_VERSION }}
        mv target/Link-*.jar target/Link-$VERSION.jar

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Link-${{ env.PLUGIN_VERSION }}
        path: target/Link-${{ env.PLUGIN_VERSION }}.jar
